<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an account</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #6b6975;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
  }

  .container {
    display: flex;
    width: 950px;
    background-color: #201f26;
    border-radius: 1rem;
    padding: 12px;
    gap: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

   #imgDiv {
    position: relative;
    width: 380px;
    flex-shrink: 0;
    border-radius: 0.75rem;
    overflow: hidden;
  }

  #image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #imgDiv::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 45%);
    pointer-events: none;
  }

  .logo {
    position: absolute;
    top: 24px;
    left: 24px;
    color: #fff;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: 1px;
  }

  .back-link {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(4px);
    color: #fff;
    text-decoration: none;
    font-size: 0.8rem;
    padding: 8px 14px;
    border-radius: 999px;
  }

  .overlay-text {
    position: absolute;
    bottom: 44px;
    left: 24px;
    right: 24px;
    color: #fff;
  }

  .overlay-text h3 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 500;
    line-height: 1.3;
  }

  .dots {
    position: absolute;
    bottom: 20px;
    left: 24px;
    display: flex;
    gap: 6px;
  }

  .dots span {
    width: 20px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.35);
  }

  .dots span.active { background: #fff; }

   #details {
    flex: 1;
    padding: 32px 32px 20px 0;
  }

  #CreateAccount {
    color: #f2eeee;
    margin: 0 0 6px 0;
    font-size: 1.9rem;
  }

  .subtext {
    color: rgba(255,255,255,0.55);
    font-size: 0.9rem;
    margin: 0 0 24px 0;
    font-weight: 400;
  }

  .subtext a { color: #a7a3ff; }

  #names {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    background: #2a2932;
    border: 1px solid #3a3944;
    color: #eee;
    border-radius: 0.5rem;
    padding: 12px 14px;
    font-size: 0.9rem;
    outline: none;
  }

  input::placeholder { color: rgba(255,255,255,0.35); }

  input:focus { border-color: #7c6ff0; }

  .field { position: relative; margin-bottom: 12px; }
/* 
  .toggle-pass {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    font-size: 0.85rem;
    user-select: none;
  } */

  .terms {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 20px 0;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.7);
  }

  .terms input { accent-color: #7c6ff0; width: 16px; height: 16px; }
  .terms a { color: #a7a3ff; }

  #createAcc {
    width: 100%;
    background-color: #7c6ff0;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 0.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  #createAcc:hover { background-color: #6a5de0; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: rgba(255,255,255,0.4);
    font-size: 0.8rem;
  }

  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.15);
  }

  .socials { display: flex; gap: 12px; }

  .social-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: transparent;
    border: 1px solid #3a3944;
    color: #eee;
    padding: 11px;
    border-radius: 0.5rem;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .social-btn:hover { background: #2a2932; }
</style>
</head>

<body>

  <div class="container">

    <div id="imgDiv">
      <img id="image" src="https://images.unsplash.com/photo-1509316785289-025f5b846b35?q=80&w=800&auto=format&fit=crop" alt="Desert dunes at dusk">
       
       <div class="overlay-text">
        <h3>Capturing Moments,<br>Creating Memories</h3>
      </div>
      <div class="dots">
        <span></span><span></span><span class="active"></span>
      </div>
    </div>

    <div id="details">

      <h2 id="CreateAccount">Create an account</h2>
      <p class="subtext">Already have an account? <a href="#" id="login">Log in</a></p>

      <div id="names">
        <input type="text" placeholder="First Name">
        <input type="text" placeholder="Last Name">
      </div>

      <div class="field">
        <input type="email" placeholder="Email">
      </div>

      <div class="field">
        <input type="password" id="pwd" placeholder="Enter your password">
       </div>

      <label class="terms">
        <input type="checkbox" checked>
        I agree to the <a href="#">Terms &amp; Conditions</a>
      </label>

      <button id="createAcc">Create account</button>

      <div class="divider">Or register with</div>

      <div class="socials">
        <button class="social-btn">Google</button>
        <button class="social-btn">Apple</button>
      </div>

    </div>

  </div>

  <script>
   
  </script>

</body>
</html>
