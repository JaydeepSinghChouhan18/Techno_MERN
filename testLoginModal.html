<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #3a3a4a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #btn {
            display: none;
        }

        #CreateAccount {
            color: #ffffff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .container {
            display: flex;
            width: 900px;
            background-color: #2a2a3a;
            border-radius: 1rem;
            padding: 0;
            margin: 20px;
            gap: 0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #image {
            width: 400px;
            height: 550px;
            border-radius: 1rem 0 0 1rem;
            object-fit: cover;
        }

        #imgDiv {
            flex-shrink: 0;
        }

        #details {
            padding: 50px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .login-link {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-link a {
            color: #999;
            text-decoration: underline;
            cursor: pointer;
        }

        #names {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        #names input {
            flex: 1;
        }
        
        .inputDetails { 
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            background-color: #3a3a4a;
            border: 1px solid #555;
            border-radius: 0.5rem;
            padding: 12px 15px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: #888;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #7c5cff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            color: #ccc;
            font-size: 14px;
            cursor: pointer;
        }

        .checkbox-group a {
            color: #999;
            text-decoration: underline;
        }

        #createAcc {
            background-color: #7c5cff;
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            margin-top: 20px;
        }

        #createAcc:hover {
            background-color: #6b4ce6;
        }

        .divider {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 45%;
            height: 1px;
            background-color: #555;
        }

        .divider::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            width: 45%;
            height: 1px;
            background-color: #555;
        }

        .social-buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .social-btn {
            flex: 1;
            background-color: #3a3a4a;
            border: 1px solid #555;
            border-radius: 0.5rem;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: border-color 0.3s;
        }

        .social-btn:hover {
            border-color: #7c5cff;
        }

    </style> 

</head>

<body>
    <button id="btn"> Login</button>

    <div class="container">

        <div id="imgDiv">
            <img id='image' src="img/mountain.jpg" alt="image" />
        </div>

        <div id="details">

            <h2 id="CreateAccount">Create an account </h2>

            <h4 style="color: rgba(133, 124, 124, 0.892);">Already have an account?<span> </span><a
                    style="color: rgba(133, 124, 124, 0.892);" id='login' href="#">Log in</a> </h4>

            <div class="inputDetails">
                 
                    <div id="names">
                        <input type="text" name="" id="" placeholder="First Name">
                        <input type="text" name="" id="" placeholder="Last Name">
                    </div>


                    <input type="text" name="" id="" placeholder="Email"> 
                    <input type="password" name="" id="" placeholder="Enter Your Password">
                     
                    <div style="display:flex; padding: 15px;">
                    <input type="checkbox" name="" id=""> 
                    <label for="">I agree to the terms and conditions  </label>        </div>
                  
                    <button id="createAcc">Create Account </button>

                
                   
                
           </div>
        </div>





    </div>
</body>

</html>
