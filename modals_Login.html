<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
 
        #loginModal{
    display:none;

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.5);

    justify-content:center;
    align-items:center;
} 

        body {
            margin: 0;
            background: #cdc5e8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #btn {
            display: block;
            color: white;
            font-size: 22px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            width: 200px;
            height: 50px;
            border-radius: .5rem;
            background-color: rgb(99, 123, 190);
            box-shadow: 2px 2px 2px 2px darkgray;
        }



        #CreateAccount {
            margin: 0;
            font-size: 42px;
            color: #f2eeee;
        }

        .subText {
            margin-top: 15px;
            margin-bottom: 30px;
        }


        .container {
            display: flex;
            width: 900px;
            height: 560px;
            background-color: rgb(52, 50, 50);
            border-radius: .7rem;
            padding: 15px;
            gap: 35px;
        }



        #imgDiv {
            width: 750px;
        }

        #image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: .5rem;
        }

        #details {
            padding: 25px;
            width: 100%;
        }

        #names {
            display: flex;
            gap: 10px;
        }

        #names input {
            width: 50%;
        }

        .inputDetails {
            padding: 10px;
        }

        .inputDetails input[type=text],
        .inputDetails input[type=password] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #666;
            background: #454050;
            color: white;
        }



        #createAcc {
            width: 100%;
            padding: 13px;
            background: #6356d8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        #createAcc:hover {
            background: #5448c5;
        }

        input::placeholder {
            color: #b2b2b2;
        }

        .subText a {
            color: #7d6cff;
        }


        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            margin-bottom: 20px;
        }

        .inputDetails {
            margin-top: 20px;
        }

        #createAcc {
            margin-top: 10px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #9f9aaa;
            margin: 25px 0;
            font-size: 14px;
        }

        .subText {
            color: rgba(133, 124, 124, .9);
            margin-bottom: 25px;
        }

        .divider span {
            flex: 1;
            height: 1px;
            background: gray;
        }

        .OAuth {
            display: flex;
            gap: 12px;
        }

        .socialBtn {
            width: 50%;
            padding: 12px;
            background: transparent;
            border: 1px solid #666;
            color: white;
            border-radius: 6px;
            cursor: pointer;

        }

        .socialBtn:hover {
            background: #44404f;
        }

        .socialBtn img {
            width: 20px;
            height: 20px;
        }

        label a {
            color: #7d6cff;

        } 
        #close{

    position:absolute;

    top:15px;
    right:20px;

    font-size:28px;
    color:white;

    cursor:pointer;
} .container{
    position:relative;
}
    </style>

</head>

<body> 

    <button id="btn"> Login</button>
 
    <div id="loginModal">
    <div class="container">
 
        <span id="close">&times;</span>
        <div id="imgDiv">
            <img id='image' src="img/mountain.jpg" alt="image" />
        </div>

        <div id="details">

            <h2 id="CreateAccount">Create an account </h2>

            <h4 class="subText">
                Already have an account?
                <a href="#">Log in</a>
            </h4>

            <div class="inputDetails">

                <div id="names">
                    <input type="text" name="" id="" placeholder="First Name">
                    <input type="text" name="" id="" placeholder="Last Name">
                </div>


                <input type="text" name="" id="" placeholder="Email">
                <input type="password" name="" id="" placeholder="Enter Your Password">

                <label for="">
                    <input type="checkbox" name="" id="">
                    I agree to the <a href="#">Terms &amp; Conditions</a>
                </label>

                <button id="createAcc">Create Account </button>

                <div class="divider">
                    <span></span>
                    Or register with
                    <span></span>
                </div>

                <div class="OAuth">

                    <button class="socialBtn">
                        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google">

                        Google
                    </button>

                    <button class="socialBtn">
                        <img src="https://cdn-icons-png.flaticon.com/512/0/747.png" alt="Apple">

                        Apple
                    </button>

                </div>


            </div>
        </div>



</div> 

    </div> 
  <script>

const btn=document.getElementById("btn");
const modal=document.getElementById("loginModal");

btn.onclick=function(){

    modal.style.display="flex";

}
const close=document.getElementById("close");

close.onclick=function(){

    modal.style.display="none";

}
</script>
</body>

</html>
