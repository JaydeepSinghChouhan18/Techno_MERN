<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #CreateAccount {
            color: rgb(229, 217, 217);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .container {
            display: flex;
            width: 850px;
            background-color: rgb(52, 50, 50);
            border-radius: .5rem;
            padding: 10px;
            margin: 20px;
            /* box-sizing: border-box;  */
            gap: 40px;
        }

        #image {
            width: 350px;
            height: 500px;
            border-radius: 0.5rem;
        }

        #details {
            padding: 20px;
        }

        #names {
            height: 20px;
            width: 10px;
            display: flex;
            gap: 5px;

        } 
        
        .inputDetails{ 
            padding:10px ;
        } 

        #createAcc{
            background-color: rgb(105, 105, 173); 
            width: 50px;
        } 


    </style> 

</head>

<body>
    <button id="btn"> Login</button>

    <div class="container">

        <div id="imgDiv">
            <img id='image' src="img/mountain.jpg" alt="image" />
        </div>

        <div id="details">

            <h2 id="CreateAccount">Create an account </h2>

            <h4 style="color: rgba(133, 124, 124, 0.892);">Already have an account?<span> </span><a
                    style="color: rgba(133, 124, 124, 0.892);" id='login' href="#">Log in</a> </h4>

            <div class="inputDetails">
                 
                    <div id="names">
                        <input type="text" name="" id="" placeholder="First Name">
                        <input type="text" name="" id="" placeholder="Last Name">
                    </div>


                    <input type="text" name="" id="" placeholder="Email"> 
                    <input type="password" name="" id="" placeholder="Enter Your Password">

                    <input type="checkbox" name="" id="">
                    <label for="">I agree to the terms and conditions  </label>
                  
                    <button id="createAcc">Create Account </button>

                
                   
                
           </div>
        </div>





    </div>
</body>

</html>
